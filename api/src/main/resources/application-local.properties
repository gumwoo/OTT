# 8080은 다른 로컬 서버와 겹치기 쉽다. 배포는 컨테이너 안이라 기본값(8080)을 그대로 쓴다
server.port=8085

spring.datasource.url=jdbc:postgresql://localhost:5434/ott
spring.datasource.username=ott
spring.datasource.password=ott

# 로컬에는 CloudFront가 없어서 쿠키는 발급만 되고 검증되지 않는다 (app-design.md §10)
ott.playback.resource-base-url=http://localhost:5180
ott.playback.signing.key-pair-id=LOCAL
ott.playback.signing.ephemeral-key=true

# transcoder 로컬 모드와 같은 디렉터리 (app-design.md §10)
ott.content.local-root=../.local/content
ott.internal.dev-token=local-dev-job-token
