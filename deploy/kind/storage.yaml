# 노드의 /ott/*는 kind extraMounts로 저장소의 .local/src·.local/content와 연결된다 (up.sh)
# hostPath는 PV에만 쓰고 Pod에는 PVC로 준다. PSS restricted는 Pod의 hostPath를 막는다
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ott-source
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadOnlyMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: ott
    name: ott-source
  hostPath:
    path: /ott/source
    type: Directory
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ott-content
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: ott
    name: ott-content
  hostPath:
    path: /ott/content
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ott-source
  namespace: ott
spec:
  accessModes: [ReadOnlyMany]
  storageClassName: ""
  volumeName: ott-source
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ott-content
  namespace: ott
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: ott-content
  resources:
    requests:
      storage: 50Gi
