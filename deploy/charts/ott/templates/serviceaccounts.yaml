apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ott.api.name" . }}
  labels:
    {{- include "ott.labels" . | nindent 4 }}
    {{- include "ott.api.selectorLabels" . | nindent 4 }}
---
# Job은 audience가 지정된 projected 토큰만 쓴다. 기본 토큰 자동 마운트는 끈다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.transcoder.serviceAccount }}
  labels:
    {{- include "ott.labels" . | nindent 4 }}
    app.kubernetes.io/name: transcoder
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: transcoder
automountServiceAccountToken: false
