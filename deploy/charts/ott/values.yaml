api:
  replicas: 1
  image:
    repository: ott-api
    tag: local
    pullPolicy: IfNotPresent
  database:
    url: ""
    # username·password 키를 가진 Secret
    secret: ott-db
  playback:
    resourceBaseUrl: ""
    keyPairId: ""
    # private-key.pem 키를 가진 Secret (PKCS#8)
    signingSecret: ott-signing
  # email·password 키를 가진 Secret. 있으면 api가 시작할 때 관리자 계정이 없으면 만든다(AdminAccountInitializer).
  # kind는 로컬 bootRun이 같은 DB에 만든 계정을 쓰므로 비워 둔다
  adminSecret: ""
  # local: content PVC(kind). s3: content 버킷(AWS). 저장소 구현은 api가 설정으로 고른다 (app-design.md §10)
  storage: local
  contentClaim: ott-content
  contentBucket: ""
  region: ""
  # AWS Load Balancer Controller가 Terraform이 만든 Target Group에 api Pod IP를 넣고 뺀다 (ADR-0011)
  targetGroupBinding:
    enabled: false
    targetGroupARN: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
      ephemeral-storage: 512Mi

opsCheck:
  schedule: "*/5 * * * *"
  # heartbeat 주기(transcoder 기본 15초)의 여러 배
  lostAfter: 2m
  # 이미지 pull과 노드 확장 시간을 포함한다
  startDeadline: 10m
  # transcode Job의 activeDeadlineSeconds(ott-admin --deadline, 기본 3600)보다 길어야 한다
  cleanupAfter: 2h
  # api.storage가 local일 때만 쓴다. hostPath에는 파일 소유자가 남아서, transcoder(uid 999)가 만든
  # 버전 폴더(755)를 지우려면 같은 uid여야 한다. s3면 api 이미지 기본 uid(10001)로 돈다
  runAsUser: 999
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi

transcoder:
  # deploy/jobs/transcode-job.yaml의 serviceAccountName과 같아야 한다
  serviceAccount: transcoder
  # deploy/jobs/transcode-job.yaml의 projected 토큰 audience와 같아야 한다
  tokenAudience: ott-api
