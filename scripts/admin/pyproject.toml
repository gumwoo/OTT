[project]
name = "ott-admin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ott-admin = "ott_admin.cli:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "types-pyyaml==6.0.12.20250915",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ott_admin"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# transcoder와 같은 규칙 (PY-02)
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "BLE", "S", "PTH", "TRY", "C4", "PL"]
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004"]

[tool.mypy]
strict = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
strict = true
