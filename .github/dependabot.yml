version: 2
# 커밋 접두어를 정하지 않으면 chore(deps)가 붙어 PR 제목 검사(GH-04)에 걸린다
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(api)
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(web)
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /transcoder
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(transcoder)
    groups:
      uv:
        patterns: ["*"]
