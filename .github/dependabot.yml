version: 2
# 커밋 접두어를 정하지 않으면 chore(deps)가 붙어 PR 제목 검사(GH-04)에 걸린다
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(api)
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(web)
    # CONVENTIONS §1 #3: jsx-a11y는 ESLint 10, typescript-eslint는 TS 6.1+를 지원하지 않는다
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # 런타임 Node 24에 맞춘다
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /transcoder
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(transcoder)
    groups:
      uv:
        patterns: ["*"]
