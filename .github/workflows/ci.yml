name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
      transcoder: ${{ steps.diff.outputs.transcoder }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 첫 push처럼 비교 대상이 없으면 전부 검사
          all=false
          if git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only "$BASE" HEAD)
          else
            all=true
          fi
          has() { { $all || grep -qE "^($1/|\.github/workflows/ci\.yml)" <<<"$files"; } && echo true || echo false; }
          for m in api web transcoder; do
            echo "$m=$(has "$m")"
          done >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew check
      - name: coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("build/reports/jacoco/test/jacocoTestReport.xml")
          if not report.exists():
              print("JaCoCo report not found")
              raise SystemExit
          counters = {c.get("type"): c for c in ET.parse(report).getroot().findall("counter")}
          print("### api coverage\n\n| type | covered |\n|---|---|")
          for kind in ("LINE", "BRANCH"):
              c = counters.get(kind)
              if c is not None:
                  covered, missed = int(c.get("covered")), int(c.get("missed"))
                  print(f"| {kind} | {covered / (covered + missed):.1%} ({covered}/{covered + missed}) |")
          EOF

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  transcoder:
    needs: changes
    if: needs.changes.outputs.transcoder == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: transcoder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src tests
      - run: uv run pytest

  ci:
    if: always()
    needs: [changes, api, web, transcoder]
    runs-on: ubuntu-24.04
    steps:
      - name: all required jobs passed or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || exit 1
          done
