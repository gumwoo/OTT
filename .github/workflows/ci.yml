name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 첫 push처럼 비교 대상이 없으면 전부 검사
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="api/"
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          has() { grep -qE "$1" <<<"$files" && echo true || echo false; }
          echo "api=$(has '^(api/|\.github/workflows/ci\.yml)')" >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew check
      - name: coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path("build/reports/jacoco/test/jacocoTestReport.xml")
          if not report.exists():
              print("JaCoCo report not found")
              raise SystemExit
          counters = {c.get("type"): c for c in ET.parse(report).getroot().findall("counter")}
          print("### api coverage\n\n| type | covered |\n|---|---|")
          for kind in ("LINE", "BRANCH"):
              c = counters.get(kind)
              if c is not None:
                  covered, missed = int(c.get("covered")), int(c.get("missed"))
                  print(f"| {kind} | {covered / (covered + missed):.1%} ({covered}/{covered + missed}) |")
          EOF

  ci:
    if: always()
    needs: [changes, api]
    runs-on: ubuntu-24.04
    steps:
      - name: all required jobs passed or skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [[ "$r" == success || "$r" == skipped ]] || exit 1
          done
