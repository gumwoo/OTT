name: policy

# 국가별 정책 변경 경로는 이것 하나다. PR에서 검증·영향 미리보기, main에서 KVS 반영 (design.md §8)
on:
  pull_request:
    paths: [policies/**, scripts/policy/**, .github/workflows/policy.yml]
  push:
    branches: [main]
    paths: [policies/**]
  # 첫 배포와 실패 뒤 다시 반영할 때. environment가 main만 받는다
  workflow_dispatch:

permissions:
  contents: read

# 지정하지 않으면 bash -e라 파이프(| tee) 앞 명령의 실패가 묻힌다
defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
      - name: base policies
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          # base에 policies가 아직 없으면 빈 디렉터리와 비교한다
          if git cat-file -e "$BASE:policies" 2> /dev/null; then
            git archive "$BASE" policies | tar -x -C "$RUNNER_TEMP/base"
          fi
      - name: check and preview
        run: |
          uv run --project scripts/policy --locked ott-policy check \
            --policies policies --base "$RUNNER_TEMP/base/policies" | tee "$RUNNER_TEMP/preview.md"
          cat "$RUNNER_TEMP/preview.md" >> "$GITHUB_STEP_SUMMARY"
      - name: comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          { echo "### 정책 영향 미리보기"; echo; cat "$RUNNER_TEMP/preview.md"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last --create-if-none

  deploy:
    # AWS를 만들고 저장소 변수(POLICY_DEPLOY_ROLE_ARN, POLICY_KVS_ARN)를 넣기 전에는 건너뛴다 (docs/aws.md)
    if: github.event_name != 'pull_request' && vars.POLICY_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    environment: policy
    # 배포는 하나씩. 앞선 배포를 취소하면 KVS와 _deploy 기록이 어긋날 수 있다
    concurrency:
      group: policy-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 마지막 배포 커밋이 이 커밋의 조상인지 본다
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.0"
      # 리전 STS로 받아야 KVS API(SigV4A)가 받는 v2 세션 토큰이 된다
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.POLICY_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: deploy
        env:
          KVS_ARN: ${{ vars.POLICY_KVS_ARN }}
          COMMIT: ${{ github.sha }}
        run: |
          uv run --project scripts/policy --locked ott-policy deploy \
            --policies policies --kvs-arn "$KVS_ARN" --commit "$COMMIT" | tee -a "$GITHUB_STEP_SUMMARY"
