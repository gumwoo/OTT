services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ott
      POSTGRES_USER: ott
      POSTGRES_PASSWORD: ott
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ott -d ott"]
      interval: 5s
      retries: 10

  content-server:
    image: nginx:1.29-alpine
    ports:
      - "8081:80"
    volumes:
      - ./.local/content:/usr/share/nginx/html/content:ro

volumes:
  pgdata:
