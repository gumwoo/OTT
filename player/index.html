<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTT Player</title>
  <style>
    :root { --bg: #fff; --fg: #111; --muted: #666; --line: #ddd; }
    @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --muted: #999; --line: #333; } }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input { flex: 1; min-width: 0; padding: 6px 8px; }
    video { width: 100%; background: #000; aspect-ratio: 16 / 9; }
    table { border-collapse: collapse; margin-top: 12px; width: 100%; }
    td { border-top: 1px solid var(--line); padding: 4px 8px; }
    td:first-child { color: var(--muted); width: 40%; }
  </style>
</head>
<body>
<main>
  <form id="form">
    <input id="src" value="/content/movie-100/v1/master.m3u8" aria-label="HLS master URL">
    <button type="submit">재생</button>
  </form>
  <video id="video" controls playsinline muted></video>
  <table id="metrics"></table>
</main>

<!-- hls.js 버전을 고정한다. 바꾸면 QoE 측정값 비교 조건이 달라진다. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<script src="qoe.js"></script>
</body>
</html>
